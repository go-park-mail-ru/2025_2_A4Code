# TYPE  DATABASE        USER            ADDRESS                 METHOD

# По умолчанию все отвергаем
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject

# Локальные подключения через Unix socket
local   all             all                                     peer

# Суперпользователь (только localhost для администрирования)
host    all             postgres        127.0.0.1/32            scram-sha-256
host    all             postgres        ::1/128                 scram-sha-256

# Сервисный пользователь (для микросервисов)
host    a4code_db       app_user        172.16.0.0/12           scram-sha-256