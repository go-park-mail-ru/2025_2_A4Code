primary_hostname = mail.flintmail.ru
domainlist local_domains = flintmail.ru : localhost

# DKIM
dkim_domain = flintmail.ru
dkim_selector = default
dkim_private_key = ~/dkim_private.key

# TLS
tls_advertise_hosts = *
tls_certificate = /etc/letsencrypt/live/flintmail.ru/fullchain.pem
tls_privatekey = /etc/letsencrypt/live/flintmail.ru/privkey.pem

acl_smtp_rcpt = accept
acl_smtp_data = accept

begin routers

lmtp_router:
  driver = accept
  domains = +local_domains
  transport = lmtp_transport

dnslookup_router:
  driver = dnslookup
  domains = ! +local_domains
  transport = remote_smtp
  no_more

begin transports

lmtp_transport:
  driver = smtp
  protocol = lmtp
  hosts = mail-ingest
  port = 2525

remote_smtp:
  driver = smtp

begin retry
* * F,2h,15m; G,16h,1h,1.5; F,4d,6h

begin rewrite

begin authenticators
