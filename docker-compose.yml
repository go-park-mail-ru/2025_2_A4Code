services:
  postgres:
    image: postgres:15
    container_name: a4-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: a4code_db
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "8004:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d a4code_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: a4-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniominio
    ports:
      - "8005:9000"
      - "8006:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: a4-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    ports:
      - "8007:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  portainer:
    image: portainer/portainer-ce
    container_name: a4-portainer
    restart: unless-stopped
    ports:
      - "8008:9000"
      - "8009:9443"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:${DOCKER_SOCK:-/var/run/docker.sock}
      - portainer-data:/data
    command: -H ${PORTAINER_DOCKER_HOST:-unix:///var/run/docker.sock}

  prometheus:
    image: prom/prometheus:latest
    container_name: a4-prometheus
    restart: unless-stopped
    ports:
      - "8010:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: a4-grafana
    restart: unless-stopped
    ports:
      - "8011:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    container_name: exporter
    hostname: exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.ignored-mount-points
      - ^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)
    ports:
      - "8016:9100"
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: auth-service/Dockerfile.auth
    container_name: a4-auth
    environment:
      CONFIG_PATH: config/docker.yml
    volumes:
      - ./db:/app/db:ro
    ports:
      - "8001:8001"
      - "8013:8013"
    depends_on:
      postgres:
        condition: service_healthy

  messages:
    build:
      context: .
      dockerfile: messages-service/Dockerfile.messages
    container_name: a4-messages
    environment:
      CONFIG_PATH: config/docker.yml
      SMTP_ADDR: exim:25
      SMTP_SKIP_TLS: "1"
      LOCAL_DOMAIN: flintmail.ru
    volumes:
      - ./db:/app/db:ro
    ports:
      - "8002:8002"
      - "8014:8014"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  profile:
    build:
      context: .
      dockerfile: profile-service/Dockerfile.profile
    container_name: a4-profile
    environment:
      CONFIG_PATH: config/docker.yml
    volumes:
      - ./db:/app/db:ro
    ports:
      - "8003:8003"
      - "8015:8015"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile.gateway
    container_name: a4-gateway
    environment:
      CONFIG_PATH: config/docker-gateway.yml
    volumes:
      - ./db:/app/db:ro
    ports:
      - "8000:8000"
      - "8012:8012"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth:
        condition: service_started
      messages:
        condition: service_started
      profile:
        condition: service_started

  mail-postgres:
    image: postgres:15
    container_name: a4-mail-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: maildb
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "8017:5432"
    volumes:
      - mail-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maildb"]
      interval: 5s
      timeout: 5s
      retries: 5

  mail-ingest:
    build:
      context: .
      dockerfile: Dockerfile.mail-ingest
    container_name: a4-mail-ingest
    environment:
      MAIL_DB_DSN: postgres://postgres:postgresql@a4-mail-postgres:5432/maildb?sslmode=disable
      MAIL_MINIO_ENDPOINT: minio:9000
      MAIL_MINIO_USER: minio
      MAIL_MINIO_PASSWORD: miniominio
      MAIL_MINIO_BUCKET: mail-ingest
      MAIL_MINIO_ATTACHMENTS_BUCKET: attachments
      MAIL_LMTP_ADDR: "0.0.0.0:2525"
      MAIL_HTTP_ADDR: ":8085"
      MAIL_DOMAIN: flintmail.ru
    depends_on:
      mail-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8085:8085"

  ingest-worker:
    build:
      context: .
      dockerfile: Dockerfile.mail-ingest
    container_name: a4-ingest-worker
    command: ["/app/mail-ingest-worker"]
    environment:
      MAIL_DB_DSN: postgres://postgres:postgresql@mail-postgres:5432/maildb?sslmode=disable
      MAIN_DB_DSN: postgres://postgres:postgresql@postgres:5432/a4code_db?sslmode=disable
      MAIL_MINIO_ENDPOINT: minio:9000
      MAIL_MINIO_USER: minio
      MAIL_MINIO_PASSWORD: miniominio
      MAIL_MINIO_BUCKET: mail-ingest
      MAIL_MINIO_ATTACHMENTS_BUCKET: attachments
      MESSAGES_GRPC_ADDR: messages:8002
      INGEST_DOMAIN: flintmail.ru
    depends_on:
      mail-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
  exim:
    build:
      context: ./deploy/exim
      dockerfile: Dockerfile
    container_name: a4-exim
    environment:
      - TZ=Europe/Moscow
    volumes:
      - /etc/letsencrypt/archive/flintmail.ru-0001/fullchain2.pem:/etc/exim4/fullchain.pem
      - /etc/letsencrypt/archive/flintmail.ru-0001/privkey2.pem:/etc/exim4/privkey.pem
      - /root/dkim_private.key:/etc/exim4/dkim_private.key:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "25:25"
    depends_on:
      - mail-ingest

volumes:
  pgdata:
  minio-data:
  pgadmin-data:
  portainer-data:
  grafana_data:
  mail-pgdata:
